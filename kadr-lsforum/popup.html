<!doctype html>
<html lang="ru" data-mode="popup">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kadr — LS Project Forum Themes</title>
<link rel="stylesheet" href="popup.css">
<script src="env.js"></script>
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="18" class="logo-bg"/>
      <path d="M16 25v-5a4 4 0 0 1 4-4h5M39 16h5a4 4 0 0 1 4 4v5M48 39v5a4 4 0 0 1-4 4h-5M25 48h-5a4 4 0 0 1-4-4v-5" class="logo-frame"/>
      <circle cx="32" cy="32" r="7.5" class="logo-dot"/>
    </svg>
    <h1 class="brand">Kadr <span class="chip">LS Forum</span></h1>
    <a class="ibtn" id="openSite" href="https://forum.ls-project.com/" target="_blank" rel="noopener" title="Открыть форум" aria-label="Открыть форум"></a>
    <button class="ibtn" id="closeSheet" type="button" title="Закрыть" aria-label="Закрыть"></button>
  </header>

  <div class="banner" id="perm" hidden>
    <p><b>Нет доступа к forum.ls-project.com.</b> Без него тема не применится.</p>
    <button class="btn" id="permBtn" type="button">Дать доступ</button>
  </div>

  <section class="hero" aria-hidden="true">
    <div class="f-nav"><i class="on"></i><i></i><i></i><i></i><span class="f-search"></span></div>
    <div class="f-card">
      <b class="f-title" id="heroName">Родная</b>
      <div class="f-row"><span class="f-ico"></span><span class="f-lines"><i></i><i class="short"></i></span><span class="f-num">14</span></div>
      <div class="f-row"><span class="f-ico"></span><span class="f-lines"><i></i><i class="short"></i></span><span class="f-num">20</span></div>
    </div>
    <span class="f-btn">Создать тему</span>
  </section>

  <main class="panel">
    <div class="themes" id="themes" role="radiogroup" aria-label="Тема"></div>
    <div class="tune" id="tune" hidden>
      <label class="tune-row"><span>Оттенок</span><input type="range" id="tuneH" class="tune-h" min="0" max="359" step="1"></label>
      <label class="tune-row"><span>Насыщенность</span><input type="range" id="tuneS" class="tune-s" min="20" max="100" step="1"></label>
      <label class="tune-row"><span>Яркость</span><input type="range" id="tuneL" class="tune-l" min="35" max="80" step="1"></label>
    </div>
    <div class="opts">
      <div class="opt">
        <span id="skinLabel">Новый дизайн</span>
        <button class="switch" id="skinSwitch" type="button" role="switch" aria-checked="true" aria-labelledby="skinLabel"><i></i></button>
      </div>
      <div class="opt only-touch" title="Кнопка «Тема» в верхней панели форума">
        <span id="menuLabel">Кнопка «Тема»</span>
        <button class="switch" id="menuSwitch" type="button" role="switch" aria-checked="true" aria-labelledby="menuLabel"><i></i></button>
      </div>
      <div class="opt dep" title="Значки на панели редактора сообщений — цветом темы">
        <span id="ckeLabel">Цветные иконки редактора</span>
        <button class="switch" id="ckeSwitch" type="button" role="switch" aria-checked="true" aria-labelledby="ckeLabel"><i></i></button>
      </div>
      <div class="opt dep">
        <span id="shadowLabel">Тени</span>
        <button class="switch" id="shadowSwitch" type="button" role="switch" aria-checked="true" aria-labelledby="shadowLabel"><i></i></button>
      </div>
      <div class="opt wide dep">
        <span id="fxLabel">Стиль</span>
        <div class="seg" id="fxSeg" role="radiogroup" aria-labelledby="fxLabel">
          <button type="button" role="radio" data-fx="plain">Обычный</button>
          <button type="button" role="radio" data-fx="glass">Стекло</button>
          <button type="button" role="radio" data-fx="material">Material</button>
        </div>
      </div>
      <div class="opt wide dep" title="Значки форума: родные, Solar или Remix">
        <span id="icLabel">Иконки</span>
        <div class="seg" id="icSeg" role="radiogroup" aria-labelledby="icLabel">
          <button type="button" role="radio" data-ic="native">Форум</button>
          <button type="button" role="radio" data-ic="solar">Solar</button>
          <button type="button" role="radio" data-ic="remix">Remix</button>
        </div>
      </div>
    </div>
  </main>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
