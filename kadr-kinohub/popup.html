<!doctype html>
<html lang="ru" data-mode="popup">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Кадр — темы для kinohub</title>
<link rel="stylesheet" href="popup.css">
<script src="env.js"></script>
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="18" class="logo-bg"/>
      <path d="M16 25v-5a4 4 0 0 1 4-4h5M39 16h5a4 4 0 0 1 4 4v5M48 39v5a4 4 0 0 1-4 4h-5M25 48h-5a4 4 0 0 1-4-4v-5" class="logo-frame"/>
      <circle cx="32" cy="32" r="7.5" class="logo-dot"/>
    </svg>
    <h1 class="brand">Кадр <span class="chip">kinohub</span></h1>
    <a class="ibtn" id="openSite" href="https://on.kinohub.vip/" target="_blank" rel="noopener" title="Открыть kinohub" aria-label="Открыть kinohub"></a>
    <button class="ibtn" id="closeSheet" type="button" title="Закрыть" aria-label="Закрыть"></button>
  </header>

  <div class="banner" id="perm" hidden>
    <p><b>Нет доступа к on.kinohub.vip.</b> Без него тема не применится.</p>
    <button class="btn" id="permBtn" type="button">Дать доступ</button>
  </div>

  <!-- Превью: мини-страница кино в цветах выбранной темы. «Фильм» называется как тема. -->
  <section class="hero" aria-hidden="true">
    <div class="hero-bar">
      <i class="hero-dot"></i><b>kinohub</b>
      <span class="hero-nav"><i></i><i></i><i></i></span>
      <span class="hero-find" id="heroFind"></span>
    </div>
    <div class="hero-film">
      <span class="hero-poster"><i id="heroRate">8.4</i></span>
      <span class="hero-info">
        <b id="heroName">Родная</b>
        <span class="hero-tags"><i>HD</i><u></u><u></u></span>
        <span class="hero-row">
          <span class="hero-btn" id="heroPlay">Смотреть</span>
          <span class="hero-ghost" id="heroPlus"></span>
        </span>
        <span class="hero-prog"><i></i></span>
      </span>
    </div>
  </section>

  <main class="panel">
    <div class="themes" id="themes" role="radiogroup" aria-label="Тема"></div>
  </main>

  <script src="themes.js"></script>
  <script src="popup.js"></script>
</body>
</html>
