<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141618">
<title>{{.Host}} · Web SSH</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="stylesheet" href="assets/vendor/xterm.css">
<link rel="stylesheet" href="assets/app.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<main class="login" id="login">
	<form class="card" id="form" novalidate>
		<div class="brand">
			<span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 7l5 5-5 5M12.5 17H19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
			<div>
				<h1>Web SSH</h1>
				<p class="host" id="host">{{.Host}}</p>
			</div>
		</div>
		<label class="field"><span>Пользователь</span><input id="user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64" required></label>
		<label class="field"><span>Пароль</span><input id="pass" name="password" type="password" autocomplete="current-password" required></label>
		<button class="btn" id="submit" type="submit">Войти</button>
		<p class="error" id="error" role="alert" hidden></p>
		<p class="hint">Логин и пароль те же, что в SSH. Пароль уходит только в sshd этого сервера и нигде не сохраняется.</p>
	</form>
	<p class="foot">webssh {{.Version}}</p>
</main>

<section class="shell pre" id="shell" aria-label="Терминал">
	<header class="bar">
		<span class="state" id="state" aria-hidden="true"></span>
		<span class="title" id="title"></span>
		<div class="tools">
			<button type="button" class="tool" id="smaller" title="Мельче" aria-label="Шрифт мельче">A−</button>
			<button type="button" class="tool" id="bigger" title="Крупнее" aria-label="Шрифт крупнее">A+</button>
			<button type="button" class="tool" id="keys-btn" title="Клавиши Esc, Tab, Ctrl, стрелки" aria-label="Дополнительные клавиши" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M7.5 14h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
			<button type="button" class="tool" id="quit" title="Отключиться">Выйти</button>
		</div>
	</header>
	<div class="term-wrap"><div class="term" id="term"></div></div>
	<nav class="keys" id="keys" aria-label="Дополнительные клавиши" hidden>
		<button type="button" data-key="esc">Esc</button>
		<button type="button" data-key="tab">Tab</button>
		<button type="button" data-mod="ctrl" aria-pressed="false">Ctrl</button>
		<button type="button" data-mod="alt" aria-pressed="false">Alt</button>
		<button type="button" data-key="left" aria-label="Влево">←</button>
		<button type="button" data-key="up" aria-label="Вверх">↑</button>
		<button type="button" data-key="down" aria-label="Вниз">↓</button>
		<button type="button" data-key="right" aria-label="Вправо">→</button>
		<button type="button" data-key="ctrl-c" title="Прервать команду">^C</button>
		<button type="button" data-key="home">Home</button>
		<button type="button" data-key="end">End</button>
		<button type="button" data-key="pgup">PgUp</button>
		<button type="button" data-key="pgdn">PgDn</button>
		<button type="button" data-text="|">|</button>
		<button type="button" data-text="/">/</button>
		<button type="button" data-text="-">-</button>
		<button type="button" data-text="~">~</button>
		<button type="button" data-key="paste">Вставить</button>
	</nav>
	<div class="overlay" id="overlay" hidden>
		<div class="card dialog" role="alertdialog" aria-labelledby="overlay-title">
			<p class="dialog-title" id="overlay-title"></p>
			<p class="dialog-text" id="overlay-text"></p>
			<div class="row">
				<button class="btn" id="again" type="button">Подключиться снова</button>
				<button class="btn ghost" id="relogin" type="button">Сменить пользователя</button>
			</div>
		</div>
	</div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Для терминала нужен JavaScript.</p></noscript>
</body>
</html>
