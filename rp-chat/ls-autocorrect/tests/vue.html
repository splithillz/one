<!doctype html><meta charset="utf-8"><div id="app"><input id="msg" v-model="text" @keydown.enter="send"><pre id="model">{{ text }}</pre></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script><script src="../ls-autocorrect.js"></script>
<script>
Vue.createApp({ data: () => ({ text: '', sent: [] }), methods: { send() { window.sent = (window.sent || []).concat(this.text.trim()); this.text = ''; } },
  mounted() { LSAutocorrect.attach(document.getElementById('msg'), { persist: false }); } }).mount('#app');
</script>
